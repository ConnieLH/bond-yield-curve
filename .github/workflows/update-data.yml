name: update-18-chinabond-yield-curves-and-deploy

on:
  schedule:
    # UTC+8: 18:13, 19:37, 20:23, 21:47, 22:19 Monday to Friday.
    - cron: '13 10 * * 1-5'
    - cron: '37 11 * * 1-5'
    - cron: '23 12 * * 1-5'
    - cron: '47 13 * * 1-5'
    - cron: '19 14 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      revision: ${{ steps.commit.outputs.revision }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: |
          python -m unittest discover -s tests -v
          node tests/test_ma_analysis.js
      - name: Fetch latest yield curve data and rebuild derived files
        env:
          CI_STRICT_FETCH: '1'
        run: python -u ci_update.py
      - name: Validate data before saving to GitHub
        run: |
          python - <<'PY'
          import json
          import math
          import subprocess
          from pathlib import Path
          import ci_update

          for path in Path('data').glob('*.json'):
              json.loads(path.read_text(encoding='utf-8'))
          for dataset in ci_update.ALL_DATASETS:
              path = dataset.filename
              before = json.loads(subprocess.check_output(['git', 'show', f'HEAD:{path}']))
              after = json.loads(Path(path).read_text(encoding='utf-8'))
              dates, rates, terms = after['dates'], after['rows'], after['terms']
              assert dates and dates == sorted(set(dates)), f'{path}: invalid dates'
              assert len(dates) == len(rates), f'{path}: date/rate mismatch'
              assert set(before['dates']).issubset(dates), f'{path}: historical dates lost'
              assert set(before['terms']).issubset(terms), f'{path}: historical terms lost'
              term_positions = {term: i for i, term in enumerate(terms)}
              date_positions = {day: i for i, day in enumerate(dates)}
              for row in rates:
                  assert len(row) == len(terms), f'{path}: invalid row length'
                  assert all(value is None or (isinstance(value, (int, float)) and math.isfinite(value)) for value in row), f'{path}: invalid rates'
              for day, row in zip(before['dates'], before['rows']):
                  new_row = rates[date_positions[day]]
                  for term, value in zip(before['terms'], row):
                      assert value is None or new_row[term_positions[term]] is not None, f'{path}: historical value lost at {day}/{term}'
              print(f'{path}: {len(dates)} records, latest {dates[-1]}')
          ci_update.parse_preset_model_js(Path('assets/preset_model_data.js').read_text(encoding='utf-8').replace('window.PRESET_MODEL_DATA', 'window.MODEL_DATA'))
          PY
      - name: Commit and push valid data updates
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/*.json assets/preset_model_data.js
          if git diff --cached --quiet; then
            echo "No data changes; no empty keepalive commit."
          else
            git commit -m "auto update yield curve data"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  publish:
    needs: update
    uses: ./.github/workflows/deploy-pages.yml
    with:
      revision: ${{ needs.update.outputs.revision }}
